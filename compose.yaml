services:
  vejrdatabase:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4321
      POSTGRES_DB: weatherdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "weatherdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  python_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmi_etl_app
    depends_on:
      vejrdatabase:
        condition: service_healthy
    environment:
      DB_HOST:  vejrdatabase
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "4321"
      DB_NAME: weatherdb
    command: ["python", "/app/src/dmi_etl/main.py"]
